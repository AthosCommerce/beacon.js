name: Publish
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  Publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          token: ${{ secrets.MACHINE_PAT }}

      - name: Set Github credentials
        run: |
          git config user.name athos-machine
          git config user.email machine@athoscommerce.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install packages
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Version
        run: npm run version

      - name: Publish packages to npm
        run: npm publish --access public
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.ATHOS_SNAPFU_AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ATHOS_SNAPFU_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Copy Files to Athos S3
        shell: bash
        run: |
          aws s3 sync --cache-control max-age=1800 --acl public-read dist/cdn s3://${{ secrets.ATHOS_SNAPFU_AWS_BUCKET }}/analytics

      - name: Invalidate Athos CDN Files
        shell: bash
        env:
          AWS_MAX_ATTEMPTS: 9
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.ATHOS_SNAPFU_AWS_DISTRIBUTION_ID }} --paths "/analytics/*"

